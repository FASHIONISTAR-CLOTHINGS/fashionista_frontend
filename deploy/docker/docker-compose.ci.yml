# =============================================================================
# FASHIONISTAR — CI Docker Compose for Build Testing
# =============================================================================
# Used by GitHub Actions to validate the Dockerfile builds successfully.
# Usage: docker compose -f deploy/docker/docker-compose.ci.yml up --abort-on-container-exit
# =============================================================================

services:
  frontend-build-test:
    build:
      context: ../..
      dockerfile: deploy/vercel/Dockerfile
    image: fashionistar-frontend-ci:latest
    container_name: fashionistar-frontend-ci
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - runtime

  # Build-only profile: just validates the image builds, doesn't run it
  frontend-build-only:
    build:
      context: ../..
      dockerfile: deploy/vercel/Dockerfile
    image: fashionistar-frontend-ci:latest
    profiles:
      - build-only
    command: ["echo", "Build successful — image is ready"]
