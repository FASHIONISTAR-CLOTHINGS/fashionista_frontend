name: Deploy to Vercel (Production)

# =============================================================================
# FASHIONISTAR -- Vercel Production Deployment via GitHub Actions
# =============================================================================
# Triggers on push to main branch.
#
# This workflow deploys to Vercel using the Vercel CLI.
# It serves as the deployment mechanism for the organization repo
# (Fashionistars/fashionista_frontend), since Vercel's native Git
# integration is connected to the personal repo
# (FASHIONISTAR-CLOTHINGS/fashionista_frontend).
#
# The personal repo uses Vercel's native Git auto-deploy
# (vercel.json: git.deploymentEnabled = true).
#
# Required GitHub Secrets:
#   VERCEL_TOKEN       -- Vercel access token
#   VERCEL_ORG_ID      -- Vercel team/org ID
#   VERCEL_PROJECT_ID  -- Vercel project ID
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - "next.config.mjs"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "tailwind.config.ts"
      - "vercel.json"
      - "sentry.*.config.ts"
      - ".github/workflows/deploy-vercel.yml"

  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run on the organization repo -- the personal repo
    # (FASHIONISTAR-CLOTHINGS/fashionista_frontend) uses Vercel's
    # native Git integration for auto-deployment.
    if: github.repository == 'Fashionistars/fashionista_frontend'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --archive=tgz --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment Summary
        run: |
          echo ""
          echo "================================================================"
          echo "  FASHIONISTAR -- Vercel Production Deployment Summary"
          echo "================================================================"
          echo ""
          echo "  Production URL: ${{ steps.deploy.outputs.deploy_url }}"
          echo "  Commit:         ${{ github.sha }}"
          echo "  Triggered by:   ${{ github.actor }}"
          echo "  Branch:         ${{ github.ref_name }}"
          echo "  Repository:     ${{ github.repository }}"
          echo "================================================================"
