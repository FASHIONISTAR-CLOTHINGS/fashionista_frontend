name: 🛍️ FASHIONISTAR — Deploy Frontend to Hugging Face

# =============================================================================
# FASHIONISTAR — Frontend HF Space Deployment Workflow
# =============================================================================
# Deploys the Next.js frontend to Hugging Face Spaces:
#
#   fashionistar-ai/fashionistar-frontend  — CPU Docker — Next.js 16 Standalone
#
# Pipeline stages:
#   1. Pre-flight build test (catches broken builds before deployment)
#   2. Ensure HF Space exists (auto-creates if missing, updates if existing)
#   3. Sync secrets to HF Space (idempotent PUT per key)
#   4. Push code to HF Space git repo (triggers Docker build)
#   5. Poll build status & health check
#   6. Fetch build/run logs on failure for debugging
#   7. Deployment summary
#
# Trigger:     push to main branch OR manual dispatch from GitHub Actions UI
# Secrets:     HF_TOKEN — Hugging Face write-access token (set in GitHub repo secrets)
#              Same token used for all 5 FASHIONISTAR HF Spaces
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'tailwind.config.ts'
      - 'Dockerfile*'
      - 'deploy/huggingface-frontend/**'
      - '.github/workflows/deploy-hf-frontend.yml'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip build tests (emergency deploys only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: hf-frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── Pre-flight: Build Test ──────────────────────────────────────────────────
  # Must pass before ANY deployment begins. Catches broken imports, missing
  # dependencies, and build errors before they reach production HF Spaces.
  build-test:
    name: 🧪 Build Test (pre-deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile || true

      - name: Build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://fashionistar-ai-fashionistar-api-v1.hf.space
          BACKEND_INTERNAL_URL: https://fashionistar-ai-fashionistar-api-v1.hf.space
          NEXT_PUBLIC_APP_URL: https://fashionistar-ai-fashionistar-frontend.hf.space
          NEXT_PUBLIC_APP_NAME: FASHIONISTAR_AI
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dgpdlknc1
          NEXT_PUBLIC_CLOUDINARY_CLOUD: dgpdlknc1
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: fashionista_ai
          NEXT_TELEMETRY_DISABLED: 1
          SENTRY_AUTH_TOKEN: ""
        run: pnpm build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js && echo "✅ Standalone server.js exists"
          test -d .next/static && echo "✅ Static assets directory exists"

  # ── Deploy to HF Space ──────────────────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Frontend → fashionistar-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-test]
    if: |
      always() &&
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped')

    env:
      SPACE_ID: fashionistar-ai/fashionistar-frontend
      SPACE_URL: https://fashionistar-ai-fashionistar-frontend.hf.space
      DEPLOY_DIR: /tmp/hf_frontend_deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Configure git
        run: |
          git config --global user.email "fashionistar.home.beauty@gmail.com"
          git config --global user.name "FASHIONISTAR CI/CD"
          git config --global init.defaultBranch main

      # ── Ensure HF Space exists (auto-create if missing) ───────────────────
      # Mirrors the backend's AI Engine provisioning pattern (deploy-hf-all.yml lines 466-491)
      # If the Space already exists, this is a no-op — it does NOT delete or recreate.
      - name: Ensure HF Space exists (create if missing)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "🔍 Checking if HF Space exists: ${SPACE_ID}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${SPACE_ID}" || true)

          echo "  API returned HTTP $HTTP"
          if [ "$HTTP" = "404" ] || [ "$HTTP" = "000" ]; then
            echo "📦 Space does not exist (HTTP $HTTP). Creating Docker Space: ${SPACE_ID}"
            CREATE_RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://huggingface.co/api/repos/create" \
              -d '{"type":"space","name":"fashionistar-frontend","organization":"fashionistar-ai","sdk":"docker","hardware":"cpu-basic","private":false,"license":"mit"}')
            echo "  API response: $CREATE_RESP"
            if echo "$CREATE_RESP" | grep -q "url"; then
              echo "✅ Space created: https://huggingface.co/spaces/${SPACE_ID}"
              sleep 5
            else
              echo "❌ Space creation failed — check API response above"
              exit 1
            fi
          else
            echo "✅ Space already exists (HTTP $HTTP) — will update in-place"
          fi

      # ── Sync secrets to HF Space ──────────────────────────────────────────
      # Mirrors the backend's AI Engine secrets pattern (deploy-hf-all.yml lines 505-529)
      # Uses PUT to /api/spaces/{id}/secrets — idempotent, safe to re-run.
      - name: Sync secrets to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          push_secret() {
            local key="$1" val="$2"
            [ -z "$val" ] && echo "  ⏭  $key not set, skipping" && return
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://huggingface.co/api/spaces/${SPACE_ID}/secrets" \
              -d "{\"key\":\"$key\",\"value\":\"$val\"}" || echo "000")
            echo "  ${key}: HTTP $HTTP"
          }

          echo "🔑 Syncing secrets to HF Space: ${SPACE_ID}"
          push_secret "NEXT_PUBLIC_BACKEND_URL"          "https://fashionistar-ai-fashionistar-api-v1.hf.space"
          push_secret "BACKEND_INTERNAL_URL"             "https://fashionistar-ai-fashionistar-api-v1.hf.space"
          push_secret "NEXT_PUBLIC_APP_URL"              "https://fashionistar-ai-fashionistar-frontend.hf.space"
          push_secret "NEXT_PUBLIC_APP_NAME"             "FASHIONISTAR_AI"
          push_secret "NEXT_PUBLIC_GOOGLE_CLIENT_ID"     "${{ secrets.GOOGLE_CLIENT_ID }}"
          push_secret "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" "dgpdlknc1"
          push_secret "NEXT_PUBLIC_CLOUDINARY_CLOUD"     "dgpdlknc1"
          push_secret "NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET" "fashionista_ai"
          push_secret "NEXTAUTH_SECRET"                  "${{ secrets.NEXTAUTH_SECRET }}"
          push_secret "NEXTAUTH_URL"                     "https://fashionistar-ai-fashionistar-frontend.hf.space"
          push_secret "JWT_SECRET"                       "${{ secrets.JWT_SECRET }}"
          push_secret "GOOGLE_CLIENT_ID"                 "${{ secrets.GOOGLE_CLIENT_ID }}"
          push_secret "GOOGLE_CLIENT_SECRET"             "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          push_secret "NEXT_PUBLIC_API_V1_URL"            "https://fashionistar-ai-fashionistar-api-v1.hf.space/api"
          push_secret "NEXT_PUBLIC_API_V2_URL"            "https://fashionistar-ai-fashionistar-api-v1.hf.space/api/v1/ninja"
          push_secret "NEXT_PUBLIC_WS_URL"               "wss://fashionistar-ai-fashionistar-api-v1.hf.space"
          push_secret "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID"   "G_MEASUREMENT_ID"
          push_secret "NEXT_PUBLIC_SENTRY_DSN"           "https://d1f4dea7757d1689e46d16d347efb97c@o4511717534138368.ingest.de.sentry.io/4511717542264912"
          push_secret "SENTRY_DSN"                       "https://d1f4dea7757d1689e46d16d347efb97c@o4511717534138368.ingest.de.sentry.io/4511717542264912"
          push_secret "NEXT_PUBLIC_FEATURE_AI_MEASUREMENTS" "true"
          push_secret "NEXT_PUBLIC_FEATURE_SOCIAL_LOGIN"  "true"
          push_secret "NEXT_PUBLIC_MEDIAPIPE_WASM_URL"   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
          push_secret "NEXT_PUBLIC_POSE_MODEL_URL"       "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task"
          push_secret "NEXT_PUBLIC_SCAN_QUALITY_THRESHOLD" "0.85"
          push_secret "NEXT_PUBLIC_SCAN_STABILITY_FRAMES" "30"
          push_secret "NEXT_PUBLIC_SCAN_COUNTDOWN_SECONDS" "3"
          push_secret "NEXT_PUBLIC_SCAN_BASE_URL"        "https://fashionistar-ai-fashionistar-frontend.hf.space/scan"
          push_secret "NEXT_PUBLIC_QR_SESSION_EXPIRY_HOURS" "24"
          push_secret "NEXT_PUBLIC_DEFAULT_LOCALE"       "en"
          push_secret "NEXT_PUBLIC_SUPPORTED_LOCALES"    "en,fr,es,pt,ar"
          push_secret "NEXT_PUBLIC_ENV"                  "production"
          push_secret "NEXT_TELEMETRY_DISABLED"          "1"
          push_secret "PORT"                             "7860"
          push_secret "HOSTNAME"                         "0.0.0.0"
          push_secret "REVALIDATE_SECRET"                "fashionistar-internal-telemetry-2026"
          echo "✅ Secrets synced"

      - name: Prepare deploy directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          # Whitelist approach: only copy files needed for Docker build
          # HF Spaces pre-receive hook rejects binary files — only push text source
          cp package.json pnpm-lock.yaml .npmrc next.config.mjs tsconfig.json "$DEPLOY_DIR/"
          cp -r src "$DEPLOY_DIR/src"
          # Remove binary font files and Satoshi_Complete fonts (HF rejects binary files)
          rm -rf "$DEPLOY_DIR/src/app/Satoshi_Complete"
          rm -rf "$DEPLOY_DIR/src/app/fonts"
          rm -f "$DEPLOY_DIR/src/app/favicon.ico"
          # Create empty placeholder font files so Next.js build doesn't fail
          mkdir -p "$DEPLOY_DIR/src/app/fonts"
          touch "$DEPLOY_DIR/src/app/fonts/Bon-Foyage-Demo.otf"
          touch "$DEPLOY_DIR/src/app/fonts/Satoshi-Regular.otf"
          # Copy public dir including SVGs (text-based, HF accepts them)
          mkdir -p "$DEPLOY_DIR/public"
          find public -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.json' -o -name '*.txt' -o -name '*.css' -o -name '*.svg' -o -name '*.webp' -o -name '*.png' -o -name '*.ico' \) -exec cp --parents {} "$DEPLOY_DIR/" \; 2>/dev/null || true
          # Copy Sentry config files if they exist
          [ -f sentry.server.config.ts ] && cp sentry.server.config.ts "$DEPLOY_DIR/"
          [ -f sentry.edge.config.ts ] && cp sentry.edge.config.ts "$DEPLOY_DIR/"
          [ -f sentry.client.config.ts ] && cp sentry.client.config.ts "$DEPLOY_DIR/"
          # Copy tailwind config if it exists
          [ -f tailwind.config.ts ] && cp tailwind.config.ts "$DEPLOY_DIR/"
          [ -f postcss.config.mjs ] && cp postcss.config.mjs "$DEPLOY_DIR/"
          [ -f postcss.config.cjs ] && cp postcss.config.cjs "$DEPLOY_DIR/"
          echo "✅ Deploy directory prepared (whitelist mode — text files only)"

      - name: Inject HF Spaces Dockerfile and README
        run: |
          cp deploy/huggingface-frontend/Dockerfile.production "$DEPLOY_DIR/Dockerfile"
          cp deploy/huggingface-frontend/README.md "$DEPLOY_DIR/README.md"
          # Convert CRLF → LF for YAML-sensitive files (HF pre-receive hook validates README.md)
          sudo apt-get update -qq && sudo apt-get install -y -qq dos2unix
          dos2unix -q "$DEPLOY_DIR/README.md" "$DEPLOY_DIR/Dockerfile"
          echo "✅ Frontend Dockerfile and README injected (CRLF→LF converted)"

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd "$DEPLOY_DIR"
          git init
          git checkout -b main
          git config user.name "FASHIONISTAR CI/CD"
          git config user.email "fashionistar.home.beauty@gmail.com"
          git config core.autocrlf false
          git add -A
          git commit -m "🛍️ Frontend Deploy: ${{ github.sha }} [GitHub Actions]"
          git remote add hf "https://__token__:${HF_TOKEN}@huggingface.co/spaces/${SPACE_ID}"
          echo "🚀 Pushing to HF Space..."
          git push hf main --force 2>&1 || {
            echo "❌ Push failed! Check HF_TOKEN secret is set in repo settings."
            exit 1
          }
          echo "✅ Frontend pushed to: https://huggingface.co/spaces/${SPACE_ID}"

      # ── Poll build status & health check ──────────────────────────────────
      # Mirrors backend's polling pattern (deploy-hf-all.yml lines 240-263)
      - name: Poll build status & health check
        id: poll
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "⏳ Polling HF for build completion (max 15min)..."
          FINAL_STATUS="unknown"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer ${HF_TOKEN}" \
              "https://huggingface.co/api/spaces/${SPACE_ID}" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtime',{}).get('stage','unknown'))" 2>/dev/null || echo "unknown")
            echo "  [${i}/60] Build status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "🎉 Frontend is RUNNING!"
              FINAL_STATUS="RUNNING"
              sleep 5
              HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 \
                "${SPACE_URL}/" || echo "000")
              echo "  Health check → HTTP $HTTP"
              if [ "$HTTP" = "200" ]; then
                echo "✅ Frontend is healthy and serving!"
              else
                echo "⚠️ Frontend returned HTTP $HTTP — may still be warming up"
              fi
              break
            elif [ "$STATUS" = "BUILD_ERROR" ] || [ "$STATUS" = "RUNTIME_ERROR" ]; then
              echo "❌ Build FAILED (status=$STATUS)"
              FINAL_STATUS="$STATUS"
              echo "   Logs: https://huggingface.co/spaces/${SPACE_ID}"
              break
            fi
            sleep 15
          done
          echo "final_status=$FINAL_STATUS" >> $GITHUB_OUTPUT

      # ── Fetch build logs on failure for debugging ─────────────────────────
      - name: Fetch build logs (on failure)
        if: steps.poll.outputs.final_status == 'BUILD_ERROR' || steps.poll.outputs.final_status == 'RUNTIME_ERROR'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  📋 BUILD LOGS"
          echo "════════════════════════════════════════════════════════════"
          curl -s -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${SPACE_ID}/logs/build" 2>/dev/null | \
            python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if line.startswith('data:'):
                  try:
                      d = json.loads(line[5:].strip())
                      if 'data' in d:
                          print(d['data'], end='')
                  except: pass
          " 2>/dev/null || echo "(Could not fetch build logs)"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  📋 RUN LOGS"
          echo "════════════════════════════════════════════════════════════"
          curl -s -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${SPACE_ID}/logs/run" 2>/dev/null | \
            python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if line.startswith('data:'):
                  try:
                      d = json.loads(line[5:].strip())
                      if 'data' in d:
                          print(d['data'], end='')
                  except: pass
          " 2>/dev/null || echo "(Could not fetch run logs)"

          echo ""
          echo "🔗 View full logs at: https://huggingface.co/spaces/${SPACE_ID}"
          exit 1

  # ── Deployment Summary ─────────────────────────────────────────────────────
  # Mirrors backend's summary job (deploy-hf-all.yml lines 582-613)
  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-test, deploy-frontend]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════════"
          echo "  🛍️ FASHIONISTAR — Frontend HF Space Deployment Summary"
          echo "══════════════════════════════════════════════════════════════"
          echo ""
          echo "  PRODUCTION URL:"
          echo "  ─────────────────────────────────────────────────────────"
          echo "  Frontend:      https://fashionistar-ai-fashionistar-frontend.hf.space"
          echo "  Health Check:  https://fashionistar-ai-fashionistar-frontend.hf.space/"
          echo ""
          echo "  BACKEND CONNECTION:"
          echo "  ─────────────────────────────────────────────────────────"
          echo "  API Gateway:   https://fashionistar-ai-fashionistar-api-v1.hf.space"
          echo "  API Docs:      https://fashionistar-ai-fashionistar-api-v1.hf.space/api/docs/"
          echo ""
          echo "  PIPELINE RESULTS:"
          echo "  ─────────────────────────────────────────────────────────"
          echo "  Build Test:    ${{ needs.build-test.result }}"
          echo "  Deploy:        ${{ needs.deploy-frontend.result }}"
          echo ""
          echo "  COMMIT:        ${{ github.sha }}"
          echo "  TRIGGERED BY:  ${{ github.actor }}"
          echo "  BRANCH:        ${{ github.ref_name }}"
          echo "══════════════════════════════════════════════════════════════"
